---
- name: Deploy AIFA application to GKE
  hosts: localhost
  connection: local
  vars:
    project_id: "{{ gcp_project_id }}"
    cluster_name: "aifa-cluster"
    region: "us-central1"
    
  tasks:
    - name: Authenticate with GCP
      community.google.gcp_auth:
        service_account_file: "{{ service_account_key }}"
      
    - name: Get GKE credentials
      community.kubernetes.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        context: "gke_{{ project_id }}_{{ region }}_{{ cluster_name }}"
      
    - name: Deploy application to GKE
      community.kubernetes.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition: "{{ lookup('file', '../kubernetes/k8s-deployment.yaml') | from_yaml }}"
        
    - name: Verify deployment
      community.kubernetes.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Deployment
        name: aifa-backend
        namespace: default
      register: deployment_status
      
    - name: Wait for deployment to be ready
      community.kubernetes.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: aifa-backend
          spec:
            replicas: 3
      async: 300
      poll: 10