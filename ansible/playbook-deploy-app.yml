---
- name: Deploy AIFA application to GKE
  hosts: localhost
  connection: local
  vars:
    project_id: "{{ gcp_project_id }}"
    cluster_name: "aifa-cluster"
    region: "us-central1"
    image_name: "your-dockerhub-username/aifa-backend:latest"
    
  tasks:
    - name: Authenticate with GCP
      community.google.gcp_auth:
        service_account_file: "{{ service_account_key }}"
      
    - name: Get GKE credentials
      community.kubernetes.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        context: "gke_{{ project_id }}_{{ region }}_{{ cluster_name }}"
      
    - name: Create image pull secret (if using private repo)
      community.kubernetes.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: dockerhub-secret
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ docker_config_json }}"
      when: private_registry | bool
      
    - name: Deploy application to GKE
      community.kubernetes.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'k8s-deployment.j2') | from_yaml }}"