name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: aifa-cluster
  GKE_ZONE: us-central1
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/aifa-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup GCP Auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        
    - name: Setup Gcloud
      uses: google-github-actions/setup-gcloud@v1
        
    - name: Configure Docker for GCR
      run: gcloud auth configure-docker gcr.io
        
    - name: Build Docker image
      run: docker build -t $IMAGE:$GITHUB_SHA .
        
    - name: Push Docker image
      run: docker push $IMAGE:$GITHUB_SHA

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup GCP Auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        
    - name: Setup Gcloud
      uses: google-github-actions/setup-gcloud@v1
        
    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v1
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}
        
    - name: Deploy to GKE
      run: |
        kubectl set image deployment/aifa-backend aifa-backend=$IMAGE:$GITHUB_SHA
        kubectl rollout status deployment/aifa-backend
        
    - name: Run Ansible deployment
      run: |
        cd ansible
        ansible-playbook playbook-deploy-app.yml \
          -e "gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
          -e "service_account_key=${{ secrets.GCP_SA_KEY }}"