apiVersion: apps/v1
kind: Deployment
metadata:
  name: aifa-backend
spec:
  replicas: 2  # Can run 2 replicas now with more resources
  selector:
    matchLabels:
      app: aifa-backend
  template:
    metadata:
      labels:
        app: aifa-backend
    spec:
      containers:
      - name: aifa-backend
        image: godwin1605/aifa-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "512Mi"    # More memory for better performance
            cpu: "250m"        # More CPU
          limits:
            memory: "1Gi"      # Higher limits
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aifa-backend-service
spec:
  type: LoadBalancer
  selector:
    app: aifa-backend
  ports:
  - port: 80
    targetPort: 3000