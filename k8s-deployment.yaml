apiVersion: apps/v1
kind: Deployment
metadata:
  name: aifa-backend
  labels:
    app: aifa-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aifa-backend
  template:
    metadata:
      labels:
        app: aifa-backend
    spec:
      containers:
      - name: aifa-backend
        image: gcr.io/your-project-id/aifa-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: FIREBASE_CONFIG
          value: "/secrets/firebase-config"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aifa-backend-service
spec:
  selector:
    app: aifa-backend
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aifa-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: aifa-backend-service
            port:
              number: 80