apiVersion: apps/v1
kind: Deployment
metadata:
  name: aifa-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aifa-backend
  template:
    metadata:
      labels:
        app: aifa-backend
    spec:
      containers:
      - name: aifa-backend
        image: your-dockerhub-username/aifa-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: aifa-backend-service
spec:
  type: LoadBalancer
  selector:
    app: aifa-backend
  ports:
  - port: 80
    targetPort: 3000