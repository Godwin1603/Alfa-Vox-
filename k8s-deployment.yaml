apiVersion: apps/v1
kind: Deployment
metadata:
  name: aifa-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aifa-backend
  template:
    metadata:
      labels:
        app: aifa-backend
    spec:
      containers:
      - name: aifa-backend
        image: godwin1605/aifa-backend:latest
        ports:
        - containerPort: 80  # ← CHANGE from 3000 to 80 (NGINX port)
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: aifa-backend-service
spec:
  type: LoadBalancer
  selector:
    app: aifa-backend
  ports:
  - port: 80
    targetPort: 80  # ← CHANGE from 3000 to 80 (NGINX port)